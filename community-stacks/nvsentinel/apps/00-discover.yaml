# Finds out how the GPU Operator already in the cluster exposes GPUs, and publishes the names
# NVSentinel needs for that mode. This Stack does not install the GPU Operator: it works with one
# installed by the nvidia-gpu-operator Stack, by Helm, or by anything else.
#
# The GPU Operator runs one of two mutually exclusive stacks, chosen by which CR it deploys:
#   device-plugin  ClusterPolicy: pods request the nvidia.com/gpu extended resource, and the DCGM
#                  DaemonSet and Service are named nvidia-dcgm.
#   dra            GPUCluster (experimental): GPUs are published in ResourceSlices, and the DCGM
#                  operands are named nvidia-dcgm-dra.
# NVSentinel and the gates must follow the same mode, so this task decides it once and the rest of
# the Stack reads the outputs.
#
# gpuDriverMode=auto reads the mode from the cluster: an existing GPUCluster means dra, an existing
# ClusterPolicy means device-plugin. With neither, the Job fails: there is no GPU Operator to
# follow. Setting device-plugin or dra explicitly skips detection, for a cluster where the GPU
# Operator is still installing or DCGM runs without it.
#
# dcgmHost overrides the DCGM endpoint, which is otherwise the mode's Service in
# gpuOperatorNamespace. With an override the Stack no longer knows which DaemonSet serves it, so
# the dcgmready gate skips its rollout wait (dcgmWait=false).
#
# The Job also checks what would otherwise fail later with no clear reason: both node selectors
# for key=value form, that a changed CPU node selector still reaches every volume in
# pinnedVolumeNamespace, where NVSentinel's MongoDB store lives, that cert-manager is installed
# when requireCertManager is set, and that the GPU Operator's ClusterPolicy has DCGM enabled. It
# publishes the selectors it checked, and the other tasks take them from its outputs.
#
# Same Job pattern as the readiness gate: `wait: true` holds the task until the Job completes, the
# release owns the ConfigMap, and the Job adds only keys the release does not declare, so a Helm
# upgrade with unchanged settings keeps the decision. A changed setting names a new Job, which
# decides again.
#
# Stack-driven AppInstances do not apply App parameter defaults. Every value is guarded with `default`.
apiVersion: management.loft.sh/v1
kind: App
metadata:
  name: nvsentinel-discover
  labels:
    app.kubernetes.io/part-of: nvsentinel-stack
spec:
  displayName: NVSentinel - Discover GPU Driver Mode
  description: >-
    Reads from the GPU Operator CR in the cluster whether GPUs run with the device plugin or with
    DRA, or takes it from the gpuDriverMode parameter, and publishes the DCGM names NVSentinel and
    the gates use.
  # Stack outputs can be read only from a namespace a task deploys into.
  defaultNamespace: nvsentinel-stack
  wait: true
  timeout: 5m
  config:
    manifests: |-
      {{- define "discover.labels" -}}
      app.kubernetes.io/name: nvsentinel-discover
      app.kubernetes.io/instance: {{ .Release.Name | quote }}
      {{- end -}}

      {{- define "discover.script" -}}
      set -eu

      log() { echo "$(date -u '+%H:%M:%S') [discover] $*"; }
      fail() { log "ERROR: $*" >&2; exit 1; }

      # Objects of a cluster-scoped kind. A kind whose CRD is not installed counts as 0; any other
      # error, such as missing RBAC, fails the Job instead of being mistaken for "none".
      # stderr is kept apart: a warning on a successful list must not be counted as an object.
      count() {
        if out=$(kubectl get "$1" -o name 2>/tmp/count.err); then
          printf '%s\n' "$out" | grep -c . || true
        else
          out=$(cat /tmp/count.err)
          case "$out" in
            *"doesn't have a resource type"*|*"could not find the requested resource"*) echo 0 ;;
            *) fail "could not list $1: $out" ;;
          esac
        fi
      }

      # A node selector is comma-separated key=value labels. A bare key is rejected: kubectl reads it
      # as "the label exists", while the pod nodeSelectors the tasks render turn it into key="", so
      # the gate would count nodes that no NVSentinel agent can schedule on.
      check_selector() {
        for pair in $(printf '%s' "$2" | tr ',' ' '); do
          printf '%s\n' "$pair" | grep -Eq '^([a-z0-9]([-a-z0-9.]*[a-z0-9])?/)?[A-Za-z0-9]([-A-Za-z0-9_.]*[A-Za-z0-9])?=([A-Za-z0-9]([-A-Za-z0-9_.]*[A-Za-z0-9])?)?$' \
            || fail "$1 node selector '$2': '${pair}' is not a key=value label. Write a label with an empty value as key="
        done
      }
      # Both selectors are published below only once they pass. The other tasks take them from this
      # task's outputs, so a selector that fails here never reaches a workload.
      check_selector CPU "${CPU_NODE_SELECTOR}"
      check_selector GPU "${GPU_NODE_SELECTOR:-}"

      # Fault quarantine keeps its state in MongoDB, whose TLS certificates come from cert-manager.
      # Without cert-manager the certificates are never issued and NVSentinel never becomes healthy,
      # with nothing saying why. Fail here instead, where the reason is in the Job log.
      if [ "${REQUIRE_CERT_MANAGER}" = true ]; then
        if ! out=$(kubectl get customresourcedefinition certificates.cert-manager.io -o name 2>&1); then
          case "$out" in
            *NotFound*|*"not found"*) fail "cordon is on, which needs cert-manager for NVSentinel's MongoDB certificates, but the cluster has no certificates.cert-manager.io CRD. Install cert-manager, or set cordon to false for monitoring only." ;;
            *) fail "could not check for cert-manager: $out" ;;
          esac
        fi
        log "cert-manager is installed"
      fi

      # The CPU node selector places controllers, Jobs and NVSentinel's MongoDB. MongoDB's volume can
      # be pinned to a node or zone, and a StatefulSet replaces its pod before the new one can
      # schedule, so a selector that drops every node the volume can reach takes the store down.
      # Fail on such a selector, so the Stack reports it. The Stack does not hold the other tasks while
      # discover re-runs, so this flags the change rather than preventing it.
      if [ -n "${CPU_NODE_SELECTOR}" ]; then
        if [ -n "${PINNED_VOLUME_NAMESPACE}" ]; then
          pvs=$(kubectl -n "$PINNED_VOLUME_NAMESPACE" get pvc -o jsonpath='{range .items[*]}{.spec.volumeName}{"\n"}{end}') \
            || fail "could not list PersistentVolumeClaims in ${PINNED_VOLUME_NAMESPACE}"
          for pv in $pvs; do
            # One line per nodeSelectorTerm (terms are ORed), expressions separated by |.
            terms=$(kubectl get pv "$pv" -o jsonpath='{range .spec.nodeAffinity.required.nodeSelectorTerms[*]}{range .matchExpressions[*]}{.key} {.operator} {.values[*]}|{end}{"\n"}{end}') \
              || fail "could not read PersistentVolume ${pv}"
            [ -n "$terms" ] || continue
            reachable=
            unknown=
            while IFS= read -r term; do
              [ -n "$term" ] || continue
              sel=
              rest=$term
              while [ -n "$rest" ]; do
                expr=${rest%%|*}; rest=${rest#*|}
                set -- $expr
                key=$1; op=$2; shift 2
                vals=$(printf '%s' "$*" | tr ' ' ',')
                case "$op" in
                  In) part="${key} in (${vals})" ;;
                  NotIn) part="${key} notin (${vals})" ;;
                  Exists) part="${key}" ;;
                  DoesNotExist) part="!${key}" ;;
                  *) unknown=1; part= ;;
                esac
                if [ -n "$part" ]; then sel="${sel:+${sel},}${part}"; fi
              done
              [ -n "$sel" ] || continue
              matched=$(kubectl get nodes -l "${sel},${CPU_NODE_SELECTOR}" -o name) \
                || fail "could not list nodes for PersistentVolume ${pv}"
              if [ -n "$matched" ]; then reachable=1; fi
            done <<EOF
      $terms
      EOF
            if [ -z "$reachable" ] && [ -z "$unknown" ]; then
              fail "no node matching the CPU node selector '${CPU_NODE_SELECTOR}' can reach PersistentVolume ${pv} (${PINNED_VOLUME_NAMESPACE}). Its pod could not schedule after the change. Keep a node it is pinned to in the selector, or move or delete its claim first."
            fi
          done
          log "CPU node selector ${CPU_NODE_SELECTOR} reaches every pinned volume in ${PINNED_VOLUME_NAMESPACE}"
        fi
      fi

      cp=$(count clusterpolicies.nvidia.com)
      gc=$(count gpuclusters.nvidia.com)
      log "found ${cp} ClusterPolicy and ${gc} GPUCluster"

      case "$REQUESTED_MODE" in
        auto)
          if [ "$cp" -gt 0 ] && [ "$gc" -gt 0 ]; then
            fail "both a ClusterPolicy and a GPUCluster exist, which the GPU Operator rejects. Delete the one you do not use (kubectl delete gpucluster gpu-cluster, or kubectl delete clusterpolicy cluster-policy), or set gpuDriverMode explicitly."
          elif [ "$gc" -gt 0 ]; then
            mode=dra; source="existing GPUCluster"
          elif [ "$cp" -gt 0 ]; then
            mode=device-plugin; source="existing ClusterPolicy"
          else
            fail "found no ClusterPolicy and no GPUCluster, so there is no GPU Operator to follow. Install the GPU Operator first, or set gpuDriverMode to device-plugin or dra."
          fi
          ;;
        device-plugin)
          mode=device-plugin; source="gpuDriverMode parameter"
          if [ "$gc" -gt 0 ] && [ "$cp" -eq 0 ]; then
            log "WARNING: gpuDriverMode is device-plugin, but the cluster has a GPUCluster and no ClusterPolicy. NVSentinel will look for nvidia-dcgm, which the DRA stack does not run."
          fi
          ;;
        dra)
          mode=dra; source="gpuDriverMode parameter"
          if [ "$cp" -gt 0 ] && [ "$gc" -eq 0 ]; then
            log "WARNING: gpuDriverMode is dra, but the cluster has a ClusterPolicy and no GPUCluster. NVSentinel will look for nvidia-dcgm-dra, which the device plugin stack does not run."
          fi
          ;;
        *)
          fail "gpuDriverMode must be auto, device-plugin or dra, got '${REQUESTED_MODE}'"
          ;;
      esac

      # The DaemonSet and Service names are the GPU Operator's fixed names for each mode.
      if [ "$mode" = dra ]; then
        dcgm_daemonset=nvidia-dcgm-dra
        capacity_source=resourceslices
        capacity_resource=gpu.nvidia.com
      else
        dcgm_daemonset=nvidia-dcgm
        capacity_source=allocatable
        capacity_resource=nvidia.com/gpu
      fi
      if [ -n "${DCGM_HOST}" ]; then
        dcgm_host=$DCGM_HOST
        dcgm_wait=false
        log "DCGM endpoint ${dcgm_host} comes from the dcgmHost parameter; dcgmready will not wait for a DaemonSet"
      else
        # The GPU Operator's Helm chart leaves the standalone DCGM host engine off by default. Without
        # it there is no nvidia-dcgm DaemonSet or Service, and dcgmready would only time out.
        if [ "$mode" = device-plugin ] && [ "$cp" -gt 0 ]; then
          dcgm_enabled=$(kubectl get clusterpolicies.nvidia.com -o jsonpath='{.items[0].spec.dcgm.enabled}') \
            || fail "could not read spec.dcgm.enabled from the ClusterPolicy"
          if [ "$dcgm_enabled" = false ]; then
            fail "the GPU Operator's ClusterPolicy has dcgm.enabled=false, so there is no nvidia-dcgm Service for NVSentinel to read from. Set dcgm.enabled=true on the GPU Operator, or set dcgmHost to the DCGM host engine you run."
          fi
        fi
        dcgm_host="${dcgm_daemonset}.${GPU_OPERATOR_NAMESPACE}.svc"
        dcgm_wait=true
      fi

      kubectl -n "$CONTRACT_NAMESPACE" patch configmap "$CONTRACT_NAME" --type merge -p "$(printf \
        '{"data":{"mode":"%s","source":"%s","dcgmHost":"%s","dcgmPort":"%s","dcgmDaemonSet":"%s","dcgmNamespace":"%s","dcgmWait":"%s","capacitySource":"%s","capacityResource":"%s","cpuNodeSelector":"%s","gpuNodeSelector":"%s","discoveredAt":"%s"}}' \
        "$mode" "$source" "$dcgm_host" "$DCGM_PORT" "$dcgm_daemonset" "$GPU_OPERATOR_NAMESPACE" "$dcgm_wait" \
        "$capacity_source" "$capacity_resource" "$CPU_NODE_SELECTOR" "${GPU_NODE_SELECTOR:-}" \
        "$(date -u '+%Y-%m-%dT%H:%M:%SZ')")" >/dev/null \
        || fail "could not record the result in configmap ${CONTRACT_NAMESPACE}/${CONTRACT_NAME}"
      log "gpuDriverMode=${mode} (${source}), DCGM at ${dcgm_host}:${DCGM_PORT}"
      {{- end -}}

      {{- $requested := .Values.gpuDriverMode | default "auto" -}}
      {{- /* A Job spec is immutable. Changing any setting, or the script, names a new Job, which also decides again. */ -}}
      {{- $hash := printf "%s|%s|%s|%s|%s|%s|%s|%s|%s" $requested (.Values.cpuNodeSelector | default "") (.Values.gpuNodeSelector | default "") (.Values.pinnedVolumeNamespace | default "") (.Values.gpuOperatorNamespace | default "gpu-operator") (.Values.dcgmHost | default "") (.Values.dcgmPort | default "5555" | toString) (.Values.requireCertManager | default "false" | toString) (include "discover.script" . | sha256sum) | sha256sum | trunc 8 -}}
      # The Job adds the decision to this ConfigMap. `kubectl -n nvsentinel-stack get cm nvsentinel-discovery -o yaml`
      # shows what was decided and why.
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: nvsentinel-discovery
        labels:
          {{- include "discover.labels" . | nindent 4 }}
      data:
        requestedMode: {{ $requested | quote }}
      ---
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: {{ .Release.Name | trunc 50 | trimSuffix "-" }}-discover
        labels:
          {{- include "discover.labels" . | nindent 4 }}
      ---
      apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: {{ .Release.Name | trunc 50 | trimSuffix "-" }}-discover
        labels:
          {{- include "discover.labels" . | nindent 4 }}
      rules:
        - apiGroups: [""]
          resources: ["configmaps"]
          resourceNames: ["nvsentinel-discovery"]
          verbs: ["get", "patch"]
      ---
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: {{ .Release.Name | trunc 50 | trimSuffix "-" }}-discover
        labels:
          {{- include "discover.labels" . | nindent 4 }}
      subjects:
        - kind: ServiceAccount
          name: {{ .Release.Name | trunc 50 | trimSuffix "-" }}-discover
          namespace: {{ .Release.Namespace }}
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: Role
        name: {{ .Release.Name | trunc 50 | trimSuffix "-" }}-discover
      ---
      # Read-only: the two GPU Operator CRs, to tell which mode the cluster already runs, and the
      # nodes and volumes the CPU node selector check reads.
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: {{ .Release.Name | trunc 40 | trimSuffix "-" }}-discover-{{ .Release.Namespace }}
        labels:
          {{- include "discover.labels" . | nindent 4 }}
      rules:
        - apiGroups: ["nvidia.com"]
          resources: ["clusterpolicies", "gpuclusters"]
          verbs: ["get", "list"]
        # The cert-manager check.
        - apiGroups: ["apiextensions.k8s.io"]
          resources: ["customresourcedefinitions"]
          resourceNames: ["certificates.cert-manager.io"]
          verbs: ["get"]
        # The CPU node selector check: nodes it matches, and the volumes it must still reach.
        - apiGroups: [""]
          resources: ["nodes", "persistentvolumes", "persistentvolumeclaims"]
          verbs: ["get", "list"]
      ---
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: {{ .Release.Name | trunc 40 | trimSuffix "-" }}-discover-{{ .Release.Namespace }}
        labels:
          {{- include "discover.labels" . | nindent 4 }}
      subjects:
        - kind: ServiceAccount
          name: {{ .Release.Name | trunc 50 | trimSuffix "-" }}-discover
          namespace: {{ .Release.Namespace }}
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: {{ .Release.Name | trunc 40 | trimSuffix "-" }}-discover-{{ .Release.Namespace }}
      ---
      # No ttlSecondsAfterFinished: the completed Job and its log stay until the release is removed.
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: {{ .Release.Name | trunc 40 | trimSuffix "-" }}-discover-{{ $hash }}
        labels:
          {{- include "discover.labels" . | nindent 4 }}
      spec:
        backoffLimit: 1
        activeDeadlineSeconds: 240
        template:
          metadata:
            labels:
              {{- include "discover.labels" . | nindent 8 }}
          spec:
            serviceAccountName: {{ .Release.Name | trunc 50 | trimSuffix "-" }}-discover
            restartPolicy: Never
            {{- with .Values.cpuNodeSelector }}
            nodeSelector:
              {{- range splitList "," . }}
              {{- if trim . }}
              {{- $kv := splitn "=" 2 (trim .) }}
              {{ $kv._0 | quote }}: {{ $kv._1 | default "" | quote }}
              {{- end }}
              {{- end }}
            {{- end }}
            securityContext:
              runAsNonRoot: true
              seccompProfile:
                type: RuntimeDefault
            containers:
              - name: discover
                image: {{ .Values.__image__ | quote }}
                securityContext:
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: true
                  capabilities:
                    drop: ["ALL"]
                resources:
                  requests:
                    cpu: 50m
                    memory: 64Mi
                  limits:
                    cpu: 500m
                    memory: 256Mi
                env:
                  # kubectl writes a discovery cache under $HOME. The root filesystem is read-only.
                  - name: HOME
                    value: /tmp
                  - name: KUBECACHEDIR
                    value: /tmp/.kube-cache
                  - name: REQUESTED_MODE
                    value: {{ $requested | quote }}
                  - name: GPU_OPERATOR_NAMESPACE
                    value: {{ .Values.gpuOperatorNamespace | default "gpu-operator" | quote }}
                  - name: DCGM_HOST
                    value: {{ .Values.dcgmHost | default "" | quote }}
                  - name: DCGM_PORT
                    value: {{ .Values.dcgmPort | default "5555" | toString | quote }}
                  - name: REQUIRE_CERT_MANAGER
                    value: {{ .Values.requireCertManager | default "false" | toString | quote }}
                  - name: CPU_NODE_SELECTOR
                    value: {{ .Values.cpuNodeSelector | default "" | quote }}
                  - name: GPU_NODE_SELECTOR
                    value: {{ .Values.gpuNodeSelector | default "" | quote }}
                  - name: PINNED_VOLUME_NAMESPACE
                    value: {{ .Values.pinnedVolumeNamespace | default "" | quote }}
                  - name: CONTRACT_NAME
                    value: nvsentinel-discovery
                  - name: CONTRACT_NAMESPACE
                    value: {{ .Release.Namespace | quote }}
                command: ["sh", "-c"]
                args:
                  - |
      {{ include "discover.script" . | indent 20 }}
                volumeMounts:
                  - name: tmp
                    mountPath: /tmp
            volumes:
              - name: tmp
                emptyDir: {}
  parameters:
    - variable: gpuDriverMode
      label: GPU driver mode
      description: >-
        How the GPU Operator exposes GPUs. auto reads it from the GPU Operator CR in the cluster and
        fails when there is none. device-plugin or dra skips detection.
      options: ["auto", "device-plugin", "dra"]
      defaultValue: auto
    - variable: gpuOperatorNamespace
      label: GPU Operator namespace
      description: Namespace the GPU Operator runs DCGM in.
      type: string
      defaultValue: gpu-operator
    - variable: dcgmHost
      label: DCGM host
      description: Optional DCGM host engine endpoint. Empty uses the GPU Operator's Service for the mode in
        gpuOperatorNamespace. Setting it also makes the dcgmready gate skip its rollout wait.
      type: string
    - variable: dcgmPort
      label: DCGM port
      type: string
      defaultValue: '5555'
    - variable: requireCertManager
      label: Require cert-manager
      description: Fail unless the cluster has cert-manager's Certificate CRD. The Stack sets it when cordon is on.
      type: boolean
      defaultValue: 'false'
    - variable: cpuNodeSelector
      label: CPU node selector
      description: Optional comma-separated key=value labels for the node that runs the Job.
      type: string
    - variable: gpuNodeSelector
      label: GPU node selector
      description: Optional comma-separated key=value labels that select the GPU workers. The Job only checks
        the format, and fails on a bare key.
      type: string
    - variable: pinnedVolumeNamespace
      label: Pinned volume namespace
      description: Optional namespace whose bound volumes must stay reachable from a node matching cpuNodeSelector.
        The Job fails, and the Stack reports it, if a selector would strand one.
      type: string
