{{- if .Values.oidc.createSecret }}
{{- $existing := lookup "v1" "Secret" (include "vbox.namespace" .) .Values.oidc.secretName }}
{{- $i := .Values.oidc.initial }}
# The OpenID Connect settings. vBox is its editor: the Settings page writes it,
# and it reads it back every few seconds.
#
# Created from oidc.initial on first install only. On upgrade the chart re-renders
# whatever the Secret holds now (lookup), so a helm upgrade never reverts changes
# made in the UI. "keep" leaves it in place on uninstall, so a reinstall picks the
# configuration up again.
#
# lookup returns nothing under `helm template` and to Argo CD, which would then
# render oidc.initial and revert the UI's changes. With GitOps, set
# oidc.createSecret=false and create the Secret once out of band.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.oidc.secretName }}
  namespace: {{ include "vbox.namespace" . }}
  labels:
    {{- include "vbox.labels" . | nindent 4 }}
  annotations:
    # How vBox finds this Secret.
    {{ .Values.oidc.annotation }}: "true"
    helm.sh/resource-policy: keep
type: Opaque
{{- if and $existing $existing.data }}
data:
  {{- toYaml $existing.data | nindent 2 }}
{{- else }}
stringData:
  enabled: {{ $i.enabled | toString | quote }}
  displayName: {{ $i.displayName | quote }}
  issuerUrl: {{ $i.issuerUrl | quote }}
  clientId: {{ $i.clientId | quote }}
  clientSecret: {{ $i.clientSecret | quote }}
  scopes: {{ $i.scopes | quote }}
  usernameClaim: {{ $i.usernameClaim | quote }}
  groupsClaim: {{ $i.groupsClaim | quote }}
  allowedGroups: {{ join "\n" $i.allowedGroups | quote }}
  providerLogout: {{ $i.providerLogout | toString | quote }}
{{- end }}
{{- end }}
