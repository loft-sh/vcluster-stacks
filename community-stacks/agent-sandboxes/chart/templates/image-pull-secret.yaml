{{- if .Values.registryCredentials.create }}
{{- $c := .Values.registryCredentials }}
{{- if not (and $c.registry $c.username $c.password) }}
{{- fail "registryCredentials.create needs registry, username and password" }}
{{- end }}
# Pull credentials for the vBox image (see registryCredentials in values.yaml).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vbox.fullname" . }}-registry
  namespace: {{ include "vbox.namespace" . }}
  labels:
    {{- include "vbox.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ dict "auths" (dict $c.registry (dict "username" $c.username "password" $c.password "auth" (printf "%s:%s" $c.username $c.password | b64enc))) | toJson | b64enc }}
{{- end }}
