{{- if .Values.rbac.create }}
# The OIDC settings Secret.
#
# list: vBox finds the Secret by its annotation, and Kubernetes cannot filter
#   Secrets by annotation on the server, nor RBAC limit a list to some of them.
#   This is the one broad grant here: a list returns every Secret in this
#   namespace with its data. vBox's dedicated namespace (vbox-system, created
#   by this chart) holds nothing else, so that is only its own Secret.
# update: only the settings Secret, by name, when the Settings page saves.
# No get (the list carries the object), no create, no delete, no watch.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "vbox.fullname" . }}-oidc-secret
  namespace: {{ include "vbox.namespace" . }}
  labels:
    {{- include "vbox.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ .Values.oidc.secretName | quote }}]
    verbs: ["update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "vbox.fullname" . }}-oidc-secret
  namespace: {{ include "vbox.namespace" . }}
  labels:
    {{- include "vbox.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "vbox.fullname" . }}-oidc-secret
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccount.name }}
    namespace: {{ include "vbox.namespace" . }}
{{- end }}
