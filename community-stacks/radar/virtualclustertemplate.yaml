# A tenant cluster template that installs Radar in every tenant cluster created from it, with the
# same Radar settings for all of them. Each one is named after its tenant cluster in Radar Cloud.
#
# Apply apps/ and stacktemplate.yaml before this template. Needs vCluster Platform 4.12 or later
# and vCluster 0.37 or later for deploy.stacks.
apiVersion: management.loft.sh/v1
kind: VirtualClusterTemplate
metadata:
  name: radar-tenant
  labels:
    app.kubernetes.io/part-of: radar-stack
spec:
  displayName: Tenant cluster with Radar
  description: Creates a tenant cluster, then installs Radar in it through deploy.stacks.
  owner:
    user: admin
  parameters:
    - variable: radarValues
      label: Radar settings
      description: Optional. Radar Helm chart values as YAML. Leave empty to run Radar only inside each tenant cluster. To connect them to Radar Cloud, paste the settings from https://app.radarhq.io/partners/vcluster
      type: multiline
  template:
    instanceTemplate:
      metadata:
        labels:
          loft.sh/stacks-sync: "true"
    helmRelease:
      chart:
        # The Platform requires a pinned vCluster version here; deploy.stacks needs 0.37 or later.
        # renovate: datasource=github-releases depName=loft-sh/vcluster extractVersion=^v(?<version>.+)$
        version: "0.37.7"
      values: |-
        deploy:
          stacks:
            - name: radar
              templateRef:
                name: radar
              prunePolicy: Prune
              # toJson keeps the pasted multi-line settings valid YAML.
              parameters:
                radarValues: {{ .Values.radarValues | default "" | toJson }}
                clusterName: {{ .Values.loft.virtualClusterName | toJson }}
