# NVIDIA GPU Operator and NVSentinel as one Stack, gated on GPUs the scheduler can actually see.
#
# Two kinds of task. GPU Operator and NVSentinel are argoCDApplication tasks: Argo CD owns their
# reconciliation once the Stack has ordered the rollout. The readiness gates and the smoke test
# are app tasks: Platform Apps whose manifests live in apps/, and whose Jobs run the
# vCluster Platform image (.Values.__image__), so the Stack needs no image or chart of its own.
#
# cert-manager is not part of the Stack, but the default configuration needs it. NVSentinel cordons
# faulty GPU nodes (nvsentinelCordon, on by default) through fault quarantine, which keeps its state
# in NVSentinel's MongoDB store, and the store's TLS certificates come from cert-manager. Install
# cert-manager first, or set nvsentinelCordon to false for monitoring only. NVSentinel drains a
# cordoned node only with nvsentinelDrain, and never reboots nodes in this Stack. With
# nvsentinelSlinkyDrain as well, nodes running Slurm through Slinky drain through Slurm instead.
#
# Apply everything in apps/ together with this template. A templateRef is resolved when the task
# runs, so a missing template shows as TemplateNotFound on that task.
#
# Tasks (the apps/ file numbers are a topological order of the graph):
#   discover        (00) app: resolves gpuDriverMode (device-plugin or dra) and its names
#   gpu-operator    (01) argoCDApplication: the NVIDIA GPU Operator
#   gpuready        (02) app: waits for minGPUs GPUs, marks gpu-stack-contract ready
#   dcgmready       (02) app: waits for the DCGM DaemonSet to finish rolling out
#   gpu-smoke-test  (03) app: CUDA VectorAdd on the GPU pool
#   slinky-drainer  (03) app: NVSentinel's Slinky drainer, rendered empty unless enabled
#   nvsentinel      (04) argoCDApplication: NVSentinel, cordoning faulty GPU nodes
#
# gpuDriverMode: the GPU Operator, both gates, the smoke test and NVSentinel all differ between the
# device-plugin and the DRA stack, and a mismatch fails quietly (NVSentinel watching a DCGM that
# does not exist, a gate counting a resource nobody advertises). Only discover reads the parameter;
# every other task takes the resolved mode and the names that go with it from discover's outputs.
#
# Timeouts: every App `timeout` stays below the Platform per-deploy cap of 30m, and each task
# timeout exceeds its App timeout, so the task timeout is the reporting path for a stuck step.
# Write durations with seconds (15m0s): metav1.Duration normalizes on write, and a GitOps copy
# written as 15m drifts forever.
#
# Stack-driven AppInstances do not apply App parameter defaults, so app tasks pass every value
# they rely on, and booleans arrive as the strings "true" and "false".
apiVersion: management.loft.sh/v1
kind: StackTemplate
metadata:
  name: nvidia-gpu-operator
  labels:
    app.kubernetes.io/part-of: nvidia-gpu-operator-stack
spec:
  displayName: NVIDIA GPU Operator and NVSentinel
  description: NVIDIA GPU Operator and NVSentinel on GPU workers, with controllers and readiness gates on CPU
    service workers, gated on GPUs the scheduler can actually see and proven with a CUDA smoke test.
  # NVIDIA's own NGC catalog logo for the GPU Operator, the icon in its Chart.yaml.
  icon: https://assets.nvidiagrid.net/ngc/logos/GPUoperator.png
  owner:
    team: loft-admins
  parameters:
    - variable: argoProject
      label: Argo CD Project
      description: Argo CD project every task's Application belongs to. It must permit the chart sources and
        the destination namespaces.
      type: string
      required: true
      defaultValue: default
      section: Argo CD
    - variable: cpuNodePool
      label: CPU Service Pool Label
      description: Value of workload.example.com/pool on CPU service workers. The GPU Operator controller, the
        NVSentinel labeler and the gate Jobs run there.
      type: string
      required: true
      defaultValue: cpu-services
      section: Node Pools
    - variable: cpuNodeSelector
      label: CPU Node Selector
      description: Comma-separated key=value labels that select the CPU service workers, replacing
        workload.example.com/pool=<cpuNodePool>. Leave empty to keep that selector, which also keeps an
        upgrade from moving anything. Changing it moves every CPU workload; discover fails on a selector that
        would strand NVSentinel's MongoDB volume, but cannot stop the change. Check before changing it.
      type: string
      section: Node Pools
    - variable: gpuNodeSelector
      label: GPU Node Selector
      description: Comma-separated key=value labels that select the GPU workers, replacing
        workload.example.com/pool=gpu-compute. Leave empty to keep that selector, which also keeps an
        upgrade from moving anything. The gpuready gate counts GPUs only on these nodes, and the NFD
        workers, NVSentinel's GPU agents and the smoke test run there, tolerating the nvidia.com/gpu
        NoSchedule taint. Changing it moves those pods.
      type: string
      section: Node Pools
    - variable: minGPUs
      label: Minimum Allocatable GPUs
      description: How many GPUs the scheduler must advertise before the gpuready gate passes and NVSentinel starts.
      type: number
      required: true
      defaultValue: '1'
      min: 1
      section: Node Pools
    - variable: gpuDriverMode
      label: GPU Driver Mode
      description: How Kubernetes consumes GPUs. device-plugin runs the GPU Operator's ClusterPolicy stack and
        pods request nvidia.com/gpu. dra runs its experimental GPUCluster stack, where the NVIDIA DRA driver
        publishes GPUs as ResourceSlices and pods request them through ResourceClaims; it needs Kubernetes
        1.34 or later. auto keeps the mode of a GPU Operator already in the cluster and installs
        device-plugin otherwise. NVSentinel always follows the GPU Operator.
      options:
        - auto
        - device-plugin
        - dra
      defaultValue: auto
      section: GPU Operator
    - variable: driverPreinstalled
      label: NVIDIA Driver Preinstalled
      description: Enable when the node OS image already contains the NVIDIA driver. GPU Operator then skips the
        driver and NVSentinel labels nodes in preinstalled-driver mode.
      type: boolean
      defaultValue: 'false'
      section: GPU Operator
    - variable: waitForClusterPolicy
      label: Gate On ClusterPolicy As Well As GPU Capacity
      description: Off by default. The gpuready gate verifies GPU capacity, which is the signal that actually
        decides whether a GPU pod can be scheduled. ClusterPolicy (GPUCluster with dra) aggregates every GPU
        Operator operand, including dcgm-exporter, so gating on it makes the Stack wait on components no
        downstream task needs. Enable it only if you want the Stack to hold until the whole operand set is healthy.
      type: boolean
      defaultValue: 'false'
      section: GPU Operator
    - variable: gpuOperatorVersion
      label: GPU Operator Version
      type: string
      required: true
      section: Versions
      # renovate: datasource=helm depName=gpu-operator registryUrl=https://helm.ngc.nvidia.com/nvidia
      defaultValue: v26.7.2
    - variable: nvsentinelCordon
      label: NVSentinel Cordons Faulty GPU Nodes
      description: Cordon a GPU node when NVSentinel detects a fault on it. Draining is separate
        (nvsentinelDrain), and NVSentinel never reboots nodes in this Stack. Needs cert-manager in the cluster, for the MongoDB store quarantine uses.
        Set false for monitoring only.
      type: boolean
      defaultValue: 'true'
      section: NVSentinel
    - variable: nvsentinelDrain
      label: NVSentinel Drains Cordoned GPU Nodes
      description: Also evict pods from a GPU node NVSentinel cordoned. Pods get to finish, and are force deleted
        after 60 minutes. No effect unless nvsentinelCordon is on.
      type: boolean
      defaultValue: 'false'
      section: NVSentinel
    - variable: nvsentinelSlinkyDrain
      label: NVSentinel Drains Slurm Nodes Through Slinky
      description: Drain cordoned GPU nodes that match the Slinky node selector through Slurm, with NVSentinel's
        Slinky drainer, instead of evicting their pods. It waits until the Slurm node is drained and its jobs
        have finished, then deletes the Slurm worker pods. Needs the Slinky Slurm operator. No effect unless
        nvsentinelCordon and nvsentinelDrain are on.
      type: boolean
      defaultValue: 'false'
      section: NVSentinel
    - variable: nvsentinelSlinkyNodeSelector
      label: NVSentinel Slinky Node Selector
      description: Label selector for the nodes that drain through Slurm. The default matches every GPU node, where a
        default Slinky install runs its Slurm workers. Matching nodes get no pod eviction, so pods outside the
        Slinky namespace stay on them.
      type: string
      defaultValue: nvidia.com/gpu.present=true
      section: NVSentinel
    - variable: nvsentinelSlinkyNamespace
      label: NVSentinel Slinky Namespace
      description: Namespace of the Slurm worker pods. On a drained node, every pod in it is deleted.
      type: string
      defaultValue: slurm
      section: NVSentinel
    - variable: nvsentinelDryRun
      label: NVSentinel Dry Run
      description: Log the cordons and drains NVSentinel would make without making them.
      type: boolean
      defaultValue: 'false'
      section: NVSentinel
    - variable: nvsentinelCircuitBreakerPercentage
      label: NVSentinel Circuit Breaker Percentage
      description: Share of GPU nodes cordoned within 5 minutes that trips NVSentinel's circuit breaker. A tripped
        breaker stops all cordoning and uncordoning until it is reset by hand. With one GPU node, the first cordon
        always trips it.
      type: number
      defaultValue: '50'
      min: 1
      section: NVSentinel
    - variable: nvsentinelCircuitBreakerMaxNodes
      label: NVSentinel Circuit Breaker Max Nodes
      description: Cordons within 5 minutes that trip the breaker regardless of fleet size. 0 uses the percentage
        alone; when both apply, the lower one wins.
      type: number
      defaultValue: '0'
      min: 0
      section: NVSentinel
    - variable: nvsentinelMongodbReplicas
      label: NVSentinel MongoDB Replicas
      description: Replicas of NVSentinel's MongoDB store, used when cordoning is on. Each requests 1 CPU and
        1.5Gi on the CPU services pool. 3 survives the loss of one CPU node.
      type: number
      defaultValue: '1'
      min: 1
      section: NVSentinel
    - variable: nvsentinelVersion
      label: NVSentinel Chart and Image Version
      type: string
      required: true
      section: Versions
      # renovate: datasource=github-releases depName=NVIDIA/NVSentinel
      defaultValue: v1.31.0
  # Values the gate publishes, readable from the StackInstance outputs subresource.
  publishedOutputs:
    - name: gpudrivermode
      fromTask:
        task: discover
        output: mode
    - name: gpucount
      fromTask:
        task: gpuready
        output: gpucount
    - name: gpupool
      fromTask:
        task: gpuready
        output: gpupool
    - name: gpunodeselector
      fromTask:
        task: gpuready
        output: gpunodeselector
    - name: dcgmhost
      fromTask:
        task: gpuready
        output: dcgmhost
    - name: dcgmport
      fromTask:
        task: gpuready
        output: dcgmport
  tasks:
    # Resolves gpuDriverMode before the GPU Operator installs, so auto can see a GPU Operator that
    # an earlier install left behind. Its outputs are the only place the rest of the graph learns
    # the mode; the mode-specific names come with it so no task repeats the mapping.
    - name: discover
      timeout: 6m0s
      app:
        templateRef:
          name: nvidia-gpu-operator-discover
        parameters:
          gpuDriverMode: '{{ .Values.gpuDriverMode }}'
          cpuNodeSelector: '{{ .Values.cpuNodeSelector | default (printf "workload.example.com/pool=%s" .Values.cpuNodePool) }}'
          # discover fails if the selector would strand a volume here. It reports, the Stack does not wait for it.
          pinnedVolumeNamespace: nvsentinel
      outputs:
        - name: mode
          fromResource:
            apiVersion: v1
            kind: ConfigMap
            namespace: gpu-stack
            name: gpu-driver-mode
            jsonPath: '{.data.mode}'
        - name: dcgmhost
          fromResource:
            apiVersion: v1
            kind: ConfigMap
            namespace: gpu-stack
            name: gpu-driver-mode
            jsonPath: '{.data.dcgmHost}'
        - name: dcgmdaemonset
          fromResource:
            apiVersion: v1
            kind: ConfigMap
            namespace: gpu-stack
            name: gpu-driver-mode
            jsonPath: '{.data.dcgmDaemonSet}'
        - name: operatorresource
          fromResource:
            apiVersion: v1
            kind: ConfigMap
            namespace: gpu-stack
            name: gpu-driver-mode
            jsonPath: '{.data.operatorResource}'
        - name: operatorresources
          fromResource:
            apiVersion: v1
            kind: ConfigMap
            namespace: gpu-stack
            name: gpu-driver-mode
            jsonPath: '{.data.operatorResources}'
        - name: capacitysource
          fromResource:
            apiVersion: v1
            kind: ConfigMap
            namespace: gpu-stack
            name: gpu-driver-mode
            jsonPath: '{.data.capacitySource}'
        - name: capacityresource
          fromResource:
            apiVersion: v1
            kind: ConfigMap
            namespace: gpu-stack
            name: gpu-driver-mode
            jsonPath: '{.data.capacityResource}'
    - name: gpu-operator
      dependsOn:
        - discover
      timeout: 45m0s
      argoCDApplication:
        templateRef:
          name: nvidia-gpu-operator-gpu-operator
        parameters:
          cpuNodePool: '{{ .Values.cpuNodePool }}'
          cpuNodeSelector: '{{ .Values.cpuNodeSelector }}'
          gpuNodeSelector: '{{ .Values.gpuNodeSelector }}'
          version: '{{ .Values.gpuOperatorVersion }}'
          project: '{{ .Values.argoProject }}'
          driverPreinstalled: '{{ .Values.driverPreinstalled | toString }}'
          gpuDriverMode: '{{ .Outputs.discover.mode }}'
    # The GPU Operator Application goes Healthy as soon as its resources are created, long
    # before a driver is built and a GPU is schedulable. This gate holds until minGPUs GPUs are
    # there, then marks the contract ready for the tasks that read its outputs. With device-plugin
    # it sums nvidia.com/gpu in node allocatable; with dra it counts whole GPUs (type gpu) that
    # the gpu.nvidia.com driver publishes in ResourceSlices, since DRA never touches allocatable.
    #
    # The name has no hyphen on purpose: a task that declares outputs is referenced as
    # {{ .Outputs.task.name }}, and the template syntax cannot address a name with "-".
    - name: gpuready
      dependsOn:
        - discover
        - gpu-operator
      timeout: 28m0s
      app:
        templateRef:
          name: nvidia-gpu-operator-gate
        parameters:
          cpuNodeSelector: '{{ .Values.cpuNodeSelector | default (printf "workload.example.com/pool=%s" .Values.cpuNodePool) }}'
          gateName: gpuready
          # Off by default. GPU capacity is the stronger signal and is checked regardless; the
          # ClusterPolicy (GPUCluster with dra) only adds a wait on operands, such as
          # dcgm-exporter, that nothing downstream depends on.
          waitEnabled: '{{ .Values.waitForClusterPolicy | toString }}'
          waitResource: '{{ .Outputs.discover.operatorresource }}'
          waitCondition: jsonpath={.status.state}=ready
          watchAPIGroup: nvidia.com
          watchResources: '{{ .Outputs.discover.operatorresources }}'
          capacitySource: '{{ .Outputs.discover.capacitysource }}'
          capacityResource: '{{ .Outputs.discover.capacityresource }}'
          # Whole GPUs only. Ignored with allocatable.
          capacityDeviceType: gpu
          capacityMin: '{{ .Values.minGPUs }}'
          capacityNodeSelector: '{{ .Values.gpuNodeSelector | default "workload.example.com/pool=gpu-compute" }}'
          contractName: gpu-stack-contract
          # The gate App is workload-agnostic. The GPU keys belong here, with the Stack that
          # publishes them. gpuPool is the pool label's value, empty once gpuNodeSelector
          # replaces it; gpuNodeSelector is the selector in effect either way.
          contractData: |
            gpuPool: {{ if .Values.gpuNodeSelector }}""{{ else }}gpu-compute{{ end }}
            gpuNodeSelector: {{ .Values.gpuNodeSelector | default "workload.example.com/pool=gpu-compute" | quote }}
            dcgmHost: {{ .Outputs.discover.dcgmhost }}
            dcgmPort: "5555"
          timeoutSeconds: "1380"
      outputs:
        - name: gpucount
          fromResource:
            apiVersion: v1
            kind: ConfigMap
            namespace: gpu-stack
            name: gpu-stack-contract
            jsonPath: '{.data.observedCount}'
        - name: gpupool
          fromResource:
            apiVersion: v1
            kind: ConfigMap
            namespace: gpu-stack
            name: gpu-stack-contract
            jsonPath: '{.data.gpuPool}'
        - name: gpunodeselector
          fromResource:
            apiVersion: v1
            kind: ConfigMap
            namespace: gpu-stack
            name: gpu-stack-contract
            jsonPath: '{.data.gpuNodeSelector}'
        - name: dcgmhost
          fromResource:
            apiVersion: v1
            kind: ConfigMap
            namespace: gpu-stack
            name: gpu-stack-contract
            jsonPath: '{.data.dcgmHost}'
        - name: dcgmport
          fromResource:
            apiVersion: v1
            kind: ConfigMap
            namespace: gpu-stack
            name: gpu-stack-contract
            jsonPath: '{.data.dcgmPort}'
    # The GPU Operator creates dcgm-exporter and nvidia-dcgm together, with nothing ordering
    # them. NVSentinel started against a DCGM host engine that is not serving reports
    # GpuDcgmConnectivityFailure. This gate only waits: no capacity check, no contract.
    # It follows gpuready so a GPU node exists: a DaemonSet that schedules no pods yet has
    # already finished rolling out. rollout covers any number of GPU workers.
    - name: dcgmready
      dependsOn:
        - discover
        - gpuready
      timeout: 15m0s
      app:
        templateRef:
          name: nvidia-gpu-operator-gate
        parameters:
          cpuNodeSelector: '{{ .Values.cpuNodeSelector | default (printf "workload.example.com/pool=%s" .Values.cpuNodePool) }}'
          gateName: dcgmready
          waitResource: 'daemonset/{{ .Outputs.discover.dcgmdaemonset }}'
          waitNamespace: gpu-operator
          waitCondition: rollout
          watchAPIGroup: apps
          watchResources: daemonsets
          capacityMin: "0"
          timeoutSeconds: "780"
    # Proves the GPU computes, not only that the scheduler advertised it. Runs beside the
    # dcgmready gate and NVSentinel, and occupies one GPU for the few seconds it takes.
    - name: gpu-smoke-test
      dependsOn:
        - discover
        - gpuready
      timeout: 12m0s
      app:
        templateRef:
          name: nvidia-gpu-operator-gpu-smoke-test
        parameters:
          gpuNodeSelector: '{{ .Outputs.gpuready.gpunodeselector }}'
          gpuCount: "1"
          gpuDriverMode: '{{ .Outputs.discover.mode }}'
    # Always runs, and renders nothing unless Slinky drain is effectively on. The same expression
    # decides customDrain in the nvsentinel task, so the drain template it mounts always exists.
    - name: slinky-drainer
      dependsOn:
        - discover
        - gpuready
      timeout: 12m0s
      app:
        templateRef:
          name: nvidia-gpu-operator-slinky-drainer
        parameters:
          enabled: '{{ and (eq (toString .Values.nvsentinelCordon) "true") (eq (toString .Values.nvsentinelDrain) "true") (eq (toString .Values.nvsentinelSlinkyDrain) "true") }}'
          version: '{{ .Values.nvsentinelVersion }}'
          slinkyNamespace: '{{ .Values.nvsentinelSlinkyNamespace }}'
          cpuNodePool: '{{ .Values.cpuNodePool }}'
          cpuNodeSelector: '{{ .Values.cpuNodeSelector }}'
    - name: nvsentinel
      dependsOn:
        - discover
        - gpuready
        - dcgmready
        # node-drainer mounts the drain template and creates DrainRequests.
        - slinky-drainer
      timeout: 20m0s
      argoCDApplication:
        templateRef:
          name: nvidia-gpu-operator-nvsentinel
        parameters:
          cpuNodePool: '{{ .Values.cpuNodePool }}'
          cpuNodeSelector: '{{ .Values.cpuNodeSelector }}'
          gpuNodeSelector: '{{ .Values.gpuNodeSelector }}'
          version: '{{ .Values.nvsentinelVersion }}'
          project: '{{ .Values.argoProject }}'
          driverPreinstalled: '{{ .Values.driverPreinstalled | toString }}'
          gpuDriverMode: '{{ .Outputs.discover.mode }}'
          cordon: '{{ .Values.nvsentinelCordon | toString }}'
          drain: '{{ .Values.nvsentinelDrain | toString }}'
          slinkyDrain: '{{ and (eq (toString .Values.nvsentinelCordon) "true") (eq (toString .Values.nvsentinelDrain) "true") (eq (toString .Values.nvsentinelSlinkyDrain) "true") }}'
          slinkyNodeSelector: '{{ .Values.nvsentinelSlinkyNodeSelector }}'
          dryRun: '{{ .Values.nvsentinelDryRun | toString }}'
          mongodbReplicas: '{{ .Values.nvsentinelMongodbReplicas }}'
          circuitBreakerPercentage: '{{ .Values.nvsentinelCircuitBreakerPercentage }}'
          circuitBreakerMaxNodes: '{{ .Values.nvsentinelCircuitBreakerMaxNodes }}'
          # Read from the contract the gate published rather than hard-coded here.
          dcgmHost: '{{ .Outputs.gpuready.dcgmhost }}'
          dcgmPort: '{{ .Outputs.gpuready.dcgmport }}'
