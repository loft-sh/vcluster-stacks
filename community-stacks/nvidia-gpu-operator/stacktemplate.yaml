# NVIDIA GPU Operator and NVSentinel as one Stack, gated on GPUs the scheduler can actually see.
#
# Two kinds of task. GPU Operator and NVSentinel are argoCDApplication tasks: Argo CD owns their
# reconciliation once the Stack has ordered the rollout. The readiness gates and the smoke test
# are app tasks: Platform Apps whose manifests live in apps/, and whose Jobs run the
# vCluster Platform image (.Values.__image__), so the Stack needs no image or chart of its own.
#
# cert-manager is not part of the Stack. NVSentinel in the dry-run configuration used here renders
# no cert-manager resources; its MongoDB store, Janitor and preflight components need it, so a
# production NVSentinel needs cert-manager installed first.
#
# Apply everything in apps/ together with this template. A templateRef is resolved when the task
# runs, so a missing template shows as TemplateNotFound on that task.
#
# Tasks (the apps/ file numbers are a topological order of the graph):
#   discover        (00) app: resolves gpuDriverMode (device-plugin or dra) and its names
#   gpu-operator    (01) argoCDApplication: the NVIDIA GPU Operator
#   gpuready        (02) app: waits for minGPUs GPUs, marks gpu-stack-contract ready
#   dcgmready       (02) app: waits for the DCGM DaemonSet to finish rolling out
#   gpu-smoke-test  (03) app: CUDA VectorAdd on the GPU pool
#   nvsentinel      (03) argoCDApplication: NVSentinel in dry-run mode
#
# gpuDriverMode: the GPU Operator, both gates, the smoke test and NVSentinel all differ between the
# device-plugin and the DRA stack, and a mismatch fails quietly (NVSentinel watching a DCGM that
# does not exist, a gate counting a resource nobody advertises). Only discover reads the parameter;
# every other task takes the resolved mode and the names that go with it from discover's outputs.
#
# Timeouts: every App `timeout` stays below the Platform per-deploy cap of 30m, and each task
# timeout exceeds its App timeout, so the task timeout is the reporting path for a stuck step.
# Write durations with seconds (15m0s): metav1.Duration normalizes on write, and a GitOps copy
# written as 15m drifts forever.
#
# Stack-driven AppInstances do not apply App parameter defaults, so app tasks pass every value
# they rely on, and booleans arrive as the strings "true" and "false".
apiVersion: management.loft.sh/v1
kind: StackTemplate
metadata:
  name: nvidia-gpu-operator
  labels:
    app.kubernetes.io/part-of: nvidia-gpu-operator-stack
spec:
  displayName: NVIDIA GPU Operator and NVSentinel
  description: NVIDIA GPU Operator and NVSentinel on GPU workers, with controllers and readiness gates on CPU
    service workers, gated on GPUs the scheduler can actually see and proven with a CUDA smoke test.
  # NVIDIA's own NGC catalog logo for the GPU Operator, the icon in its Chart.yaml.
  icon: https://assets.nvidiagrid.net/ngc/logos/GPUoperator.png
  owner:
    team: loft-admins
  parameters:
    - variable: argoProject
      label: Argo CD Project
      description: Argo CD project every task's Application belongs to. It must permit the chart sources and
        the destination namespaces.
      type: string
      required: true
      defaultValue: default
      section: Argo CD
    - variable: cpuNodePool
      label: CPU Service Pool Label
      description: Value of workload.example.com/pool on CPU service workers. The GPU Operator controller, the
        NVSentinel labeler and the gate Jobs run there.
      type: string
      required: true
      defaultValue: cpu-services
      section: Node Pools
    - variable: minGPUs
      label: Minimum Allocatable GPUs
      description: How many GPUs the scheduler must advertise before the gpuready gate passes and NVSentinel starts.
      type: number
      required: true
      defaultValue: '1'
      min: 1
      section: Node Pools
    - variable: gpuDriverMode
      label: GPU Driver Mode
      description: How Kubernetes consumes GPUs. device-plugin runs the GPU Operator's ClusterPolicy stack and
        pods request nvidia.com/gpu. dra runs its experimental GPUCluster stack, where the NVIDIA DRA driver
        publishes GPUs as ResourceSlices and pods request them through ResourceClaims; it needs Kubernetes
        1.34 or later. auto keeps the mode of a GPU Operator already in the cluster and installs
        device-plugin otherwise. NVSentinel always follows the GPU Operator.
      options:
        - auto
        - device-plugin
        - dra
      defaultValue: auto
      section: GPU Operator
    - variable: driverPreinstalled
      label: NVIDIA Driver Preinstalled
      description: Enable when the node OS image already contains the NVIDIA driver. GPU Operator then skips the
        driver and NVSentinel labels nodes in preinstalled-driver mode.
      type: boolean
      defaultValue: 'false'
      section: GPU Operator
    - variable: waitForClusterPolicy
      label: Gate On ClusterPolicy As Well As GPU Capacity
      description: Off by default. The gpuready gate verifies GPU capacity, which is the signal that actually
        decides whether a GPU pod can be scheduled. ClusterPolicy (GPUCluster with dra) aggregates every GPU
        Operator operand, including dcgm-exporter, so gating on it makes the Stack wait on components no
        downstream task needs. Enable it only if you want the Stack to hold until the whole operand set is healthy.
      type: boolean
      defaultValue: 'false'
      section: GPU Operator
    - variable: gpuOperatorVersion
      label: GPU Operator Version
      type: string
      required: true
      section: Versions
      # renovate: datasource=helm depName=gpu-operator registryUrl=https://helm.ngc.nvidia.com/nvidia
      defaultValue: v26.7.2
    - variable: nvsentinelVersion
      label: NVSentinel Chart and Image Version
      type: string
      required: true
      section: Versions
      # renovate: datasource=github-releases depName=NVIDIA/NVSentinel
      defaultValue: v1.31.0
  # Values the gate publishes, readable from the StackInstance outputs subresource.
  publishedOutputs:
    - name: gpudrivermode
      fromTask:
        task: discover
        output: mode
    - name: gpucount
      fromTask:
        task: gpuready
        output: gpucount
    - name: gpupool
      fromTask:
        task: gpuready
        output: gpupool
    - name: dcgmhost
      fromTask:
        task: gpuready
        output: dcgmhost
    - name: dcgmport
      fromTask:
        task: gpuready
        output: dcgmport
  tasks:
    # Resolves gpuDriverMode before the GPU Operator installs, so auto can see a GPU Operator that
    # an earlier install left behind. Its outputs are the only place the rest of the graph learns
    # the mode; the mode-specific names come with it so no task repeats the mapping.
    - name: discover
      timeout: 6m0s
      app:
        templateRef:
          name: nvidia-gpu-operator-discover
        parameters:
          gpuDriverMode: '{{ .Values.gpuDriverMode }}'
          cpuNodeSelector: 'workload.example.com/pool={{ .Values.cpuNodePool }}'
      outputs:
        - name: mode
          fromResource:
            apiVersion: v1
            kind: ConfigMap
            namespace: gpu-stack
            name: gpu-driver-mode
            jsonPath: '{.data.mode}'
        - name: dcgmhost
          fromResource:
            apiVersion: v1
            kind: ConfigMap
            namespace: gpu-stack
            name: gpu-driver-mode
            jsonPath: '{.data.dcgmHost}'
        - name: dcgmdaemonset
          fromResource:
            apiVersion: v1
            kind: ConfigMap
            namespace: gpu-stack
            name: gpu-driver-mode
            jsonPath: '{.data.dcgmDaemonSet}'
        - name: operatorresource
          fromResource:
            apiVersion: v1
            kind: ConfigMap
            namespace: gpu-stack
            name: gpu-driver-mode
            jsonPath: '{.data.operatorResource}'
        - name: operatorresources
          fromResource:
            apiVersion: v1
            kind: ConfigMap
            namespace: gpu-stack
            name: gpu-driver-mode
            jsonPath: '{.data.operatorResources}'
        - name: capacitysource
          fromResource:
            apiVersion: v1
            kind: ConfigMap
            namespace: gpu-stack
            name: gpu-driver-mode
            jsonPath: '{.data.capacitySource}'
        - name: capacityresource
          fromResource:
            apiVersion: v1
            kind: ConfigMap
            namespace: gpu-stack
            name: gpu-driver-mode
            jsonPath: '{.data.capacityResource}'
    - name: gpu-operator
      dependsOn:
        - discover
      timeout: 45m0s
      argoCDApplication:
        templateRef:
          name: nvidia-gpu-operator-gpu-operator
        parameters:
          cpuNodePool: '{{ .Values.cpuNodePool }}'
          version: '{{ .Values.gpuOperatorVersion }}'
          project: '{{ .Values.argoProject }}'
          driverPreinstalled: '{{ .Values.driverPreinstalled | toString }}'
          gpuDriverMode: '{{ .Outputs.discover.mode }}'
    # The GPU Operator Application goes Healthy as soon as its resources are created, long
    # before a driver is built and a GPU is schedulable. This gate holds until minGPUs GPUs are
    # there, then marks the contract ready for the tasks that read its outputs. With device-plugin
    # it sums nvidia.com/gpu in node allocatable; with dra it counts whole GPUs (type gpu) that
    # the gpu.nvidia.com driver publishes in ResourceSlices, since DRA never touches allocatable.
    #
    # The name has no hyphen on purpose: a task that declares outputs is referenced as
    # {{ .Outputs.task.name }}, and the template syntax cannot address a name with "-".
    - name: gpuready
      dependsOn:
        - discover
        - gpu-operator
      timeout: 28m0s
      app:
        templateRef:
          name: nvidia-gpu-operator-gate
        parameters:
          cpuNodeSelector: 'workload.example.com/pool={{ .Values.cpuNodePool }}'
          gateName: gpuready
          # Off by default. GPU capacity is the stronger signal and is checked regardless; the
          # ClusterPolicy (GPUCluster with dra) only adds a wait on operands, such as
          # dcgm-exporter, that nothing downstream depends on.
          waitEnabled: '{{ .Values.waitForClusterPolicy | toString }}'
          waitResource: '{{ .Outputs.discover.operatorresource }}'
          waitCondition: jsonpath={.status.state}=ready
          watchAPIGroup: nvidia.com
          watchResources: '{{ .Outputs.discover.operatorresources }}'
          capacitySource: '{{ .Outputs.discover.capacitysource }}'
          capacityResource: '{{ .Outputs.discover.capacityresource }}'
          # Whole GPUs only. Ignored with allocatable.
          capacityDeviceType: gpu
          capacityMin: '{{ .Values.minGPUs }}'
          capacityNodeSelector: workload.example.com/pool=gpu-compute
          contractName: gpu-stack-contract
          # The gate App is workload-agnostic. The GPU keys belong here, with the Stack that
          # publishes them.
          contractData: |
            gpuPool: gpu-compute
            dcgmHost: {{ .Outputs.discover.dcgmhost }}
            dcgmPort: "5555"
          timeoutSeconds: "1380"
      outputs:
        - name: gpucount
          fromResource:
            apiVersion: v1
            kind: ConfigMap
            namespace: gpu-stack
            name: gpu-stack-contract
            jsonPath: '{.data.observedCount}'
        - name: gpupool
          fromResource:
            apiVersion: v1
            kind: ConfigMap
            namespace: gpu-stack
            name: gpu-stack-contract
            jsonPath: '{.data.gpuPool}'
        - name: dcgmhost
          fromResource:
            apiVersion: v1
            kind: ConfigMap
            namespace: gpu-stack
            name: gpu-stack-contract
            jsonPath: '{.data.dcgmHost}'
        - name: dcgmport
          fromResource:
            apiVersion: v1
            kind: ConfigMap
            namespace: gpu-stack
            name: gpu-stack-contract
            jsonPath: '{.data.dcgmPort}'
    # The GPU Operator creates dcgm-exporter and nvidia-dcgm together, with nothing ordering
    # them. NVSentinel started against a DCGM host engine that is not serving reports
    # GpuDcgmConnectivityFailure. This gate only waits: no capacity check, no contract.
    # It follows gpuready so a GPU node exists: a DaemonSet that schedules no pods yet has
    # already finished rolling out. rollout covers any number of GPU workers.
    - name: dcgmready
      dependsOn:
        - discover
        - gpuready
      timeout: 15m0s
      app:
        templateRef:
          name: nvidia-gpu-operator-gate
        parameters:
          cpuNodeSelector: 'workload.example.com/pool={{ .Values.cpuNodePool }}'
          gateName: dcgmready
          waitResource: 'daemonset/{{ .Outputs.discover.dcgmdaemonset }}'
          waitNamespace: gpu-operator
          waitCondition: rollout
          watchAPIGroup: apps
          watchResources: daemonsets
          capacityMin: "0"
          timeoutSeconds: "780"
    # Proves the GPU computes, not only that the scheduler advertised it. Runs beside the
    # dcgmready gate and NVSentinel, and occupies one GPU for the few seconds it takes.
    - name: gpu-smoke-test
      dependsOn:
        - discover
        - gpuready
      timeout: 12m0s
      app:
        templateRef:
          name: nvidia-gpu-operator-gpu-smoke-test
        parameters:
          gpuNodeSelector: 'workload.example.com/pool={{ .Outputs.gpuready.gpupool }}'
          gpuCount: "1"
          gpuDriverMode: '{{ .Outputs.discover.mode }}'
    - name: nvsentinel
      dependsOn:
        - discover
        - gpuready
        - dcgmready
      timeout: 20m0s
      argoCDApplication:
        templateRef:
          name: nvidia-gpu-operator-nvsentinel
        parameters:
          cpuNodePool: '{{ .Values.cpuNodePool }}'
          version: '{{ .Values.nvsentinelVersion }}'
          project: '{{ .Values.argoProject }}'
          driverPreinstalled: '{{ .Values.driverPreinstalled | toString }}'
          gpuDriverMode: '{{ .Outputs.discover.mode }}'
          # Read from the contract the gate published rather than hard-coded here.
          dcgmHost: '{{ .Outputs.gpuready.dcgmhost }}'
          dcgmPort: '{{ .Outputs.gpuready.dcgmport }}'
