# CPU controllers and GPU node agents use the pool labels from node-profiles.yaml.
# platformConnector is a node-local socket service, so it stays with GPU health monitors.
#
# gpuDriverMode must match the GPU Operator's. With dra, the metadata-collector holds a DRA
# admin-access ResourceClaim on each node's GPUs instead of running with the `nvidia` RuntimeClass,
# which the DRA stack does not create. Kubernetes admits admin-access claims only in a namespace
# labeled resource.kubernetes.io/admin-access=true, and the chart does not set it, so Argo CD labels
# the namespace it creates. The label is "false" in device-plugin mode, which grants nothing.
#
# Fault handling: by default NVSentinel cordons a GPU node it finds faulty (fault quarantine,
# dryRun off). drain=true also evicts pods from a cordoned node (node-drainer, with the chart's
# eviction defaults); it has no effect without cordon, since the drainer acts on quarantined nodes.
# slinkyDrain=true hands nodes matching slinkyNodeSelector to NVSentinel's Slinky drainer instead
# (customDrain): node-drainer creates a DrainRequest and the drainer drains the node through Slurm.
# The drainer, its CRD and the drain template ConfigMap come from the slinky-drainer App, which must
# be deployed first. Nodes not matching the selector keep the eviction defaults.
# It never reboots: fault-remediation and janitor stay off. Quarantine keeps its state in NVSentinel's MongoDB store, which gets its TLS
# certificates from cert-manager, so cordon=true requires cert-manager in the cluster. cordon=false
# runs monitoring only, with no MongoDB and no cert-manager dependency. dryRun=true keeps
# quarantine running but only logs what it would cordon.
#
# Quarantine's circuit breaker stays on. It trips when the nodes cordoned within 5 minutes reach
# ceil(GPU nodes x circuitBreakerPercentage / 100), capped by circuitBreakerMaxNodes when that is
# above 0. A tripped breaker halts all event processing, healthy events included, until it is reset
# by hand, so with one GPU node the first cordon trips it.
apiVersion: management.loft.sh/v1
kind: ArgoCDApplicationTemplate
metadata:
  name: nvidia-gpu-operator-nvsentinel
  labels:
    app.kubernetes.io/part-of: nvidia-gpu-operator-stack
spec:
  displayName: NVIDIA GPU Stack - NVSentinel
  owner:
    team: loft-admins
  parameters:
    - variable: cpuNodePool
      label: CPU Service Pool Label
      description: Value of workload.example.com/pool on CPU service workers.
      type: string
      required: true
      defaultValue: cpu-services
    - variable: cpuNodeSelector
      label: CPU Node Selector
      description: Comma-separated key=value labels that select the CPU service workers. Empty selects
        workload.example.com/pool=<cpuNodePool>.
      type: string
    - variable: version
      label: Chart Version and Image Tag
      type: string
      required: true
      # renovate: datasource=github-releases depName=NVIDIA/NVSentinel
      defaultValue: v1.31.0
    - variable: project
      label: Argo CD Project
      type: string
      required: true
      defaultValue: default
    - variable: driverPreinstalled
      label: NVIDIA Driver Preinstalled
      type: boolean
      defaultValue: 'false'
    - variable: gpuDriverMode
      label: GPU Driver Mode
      description: Must match the GPU Operator. Inside the Stack, the discover task supplies it.
      options:
        - device-plugin
        - dra
      defaultValue: device-plugin
    - variable: cordon
      label: Cordon Faulty GPU Nodes
      description: Cordon a node when NVSentinel detects a GPU fault. Never reboots. Needs
        cert-manager in the cluster, for the MongoDB store that quarantine uses.
      type: boolean
      defaultValue: 'true'
    - variable: drain
      label: Drain Cordoned GPU Nodes
      description: Also evict pods from a node NVSentinel cordoned. Pods get to finish, and are force deleted
        after 60 minutes. No effect unless cordoning is on.
      type: boolean
      defaultValue: 'false'
    - variable: slinkyDrain
      label: Drain Slurm Nodes Through Slinky
      description: Hand cordoned nodes matching the Slinky node selector to NVSentinel's Slinky drainer, which
        waits for Slurm to drain them before deleting the Slurm worker pods. Needs drain on and the
        slinky-drainer App deployed.
      type: boolean
      defaultValue: 'false'
    - variable: slinkyNodeSelector
      label: Slinky Node Selector
      description: Label selector for the nodes that drain through Slurm. Matching nodes get no pod eviction, so
        pods outside the Slinky namespace stay on them.
      type: string
      defaultValue: nvidia.com/gpu.present=true
    - variable: dryRun
      label: Dry Run
      description: Log the cordons and drains NVSentinel would make without making them.
      type: boolean
      defaultValue: 'false'
    - variable: circuitBreakerPercentage
      label: Circuit Breaker Percentage
      description: Share of GPU nodes cordoned within 5 minutes that trips the circuit breaker, which then stops
        all cordoning and uncordoning until reset. Used when cordoning is on.
      type: number
      defaultValue: '50'
      min: 1
    - variable: circuitBreakerMaxNodes
      label: Circuit Breaker Max Nodes
      description: Cordons within 5 minutes that trip the breaker regardless of fleet size. 0 uses the percentage
        alone; when both apply, the lower one wins.
      type: number
      defaultValue: '0'
      min: 0
    - variable: mongodbReplicas
      label: MongoDB Replicas
      description: Replicas of NVSentinel's MongoDB store, used when cordoning is on. 1 fits a small CPU pool; 3
        survives the loss of one CPU node, with each replica requesting 1 CPU and 1.5Gi.
      type: number
      defaultValue: '1'
      min: 1
    - variable: dcgmHost
      label: DCGM Service Host
      description: Supplied by the gpuready gate's contract when this template runs inside the nvidia-gpu-operator Stack.
        The default applies when it is deployed on its own.
      type: string
      defaultValue: nvidia-dcgm.gpu-operator.svc
    - variable: dcgmPort
      label: DCGM Service Port
      type: string
      defaultValue: '5555'
  template:
    spec:
      destination:
        namespace: nvsentinel
      project: '{{ .Values.project }}'
      source:
        chart: nvsentinel
        repoURL: oci://ghcr.io/nvidia/nvsentinel
        targetRevision: '{{ .Values.version }}'
        helm:
          releaseName: nvsentinel
          values: |
            {{- /* cpuNodeSelector (comma-separated key=value), or workload.example.com/pool=<cpuNodePool> when empty. */}}
            {{- $cpuNodeSelector := dict "kubernetes.io/os" "linux" }}
            {{- range splitList "," (.Values.cpuNodeSelector | default (printf "workload.example.com/pool=%s" (.Values.cpuNodePool | default "cpu-services"))) }}
            {{- if trim . }}
            {{- $kv := splitn "=" 2 (trim .) }}
            {{- $_ := set $cpuNodeSelector $kv._0 ($kv._1 | default "") }}
            {{- end }}
            {{- end }}
            {{- $dra := eq (.Values.gpuDriverMode | default "device-plugin") "dra" }}
            {{- $cordon := ne (.Values.cordon | toString) "false" }}
            {{- $drain := and $cordon (eq (.Values.drain | toString) "true") }}
            {{- $slinky := and $drain (eq (.Values.slinkyDrain | toString) "true") }}
            {{- $replicas := .Values.mongodbReplicas | default "1" | int }}
            global:
              # Booleans arrive as strings; the default is cordon on, dry run off.
              dryRun: {{ eq (.Values.dryRun | toString) "true" }}
              # A YAML boolean: the chart fails on a quoted value.
              gpuDraEnabled: {{ $dra }}
              image:
                tag: '{{ .Values.version }}'
              dcgm:
                enabled: true
                service:
                  # default guards against an empty value if this runs outside the Stack.
                  endpoint: {{ .Values.dcgmHost | default "nvidia-dcgm.gpu-operator.svc" | quote }}
                  port: {{ .Values.dcgmPort | default "5555" }}
              gpuHealthMonitor:
                enabled: true
              syslogHealthMonitor:
                enabled: true
              nicHealthMonitor:
                enabled: false
              cspHealthMonitor:
                enabled: false
              healthEventsAnalyzer:
                enabled: false
              # Quarantine stores its state in MongoDB and does not start without it.
              mongodbStore:
                enabled: {{ $cordon }}
              faultQuarantine:
                enabled: {{ $cordon }}
              # Drain is opt-in and needs quarantine. Never reboot.
              nodeDrainer:
                enabled: {{ $drain }}
              faultRemediation:
                enabled: false
              janitor:
                enabled: false
              janitorProvider:
                enabled: false
              tracing:
                enabled: false
                endpoint: ''
              auditLogging:
                enabled: false
              nodeSelector:
                kubernetes.io/os: linux
                workload.example.com/pool: gpu-compute
              tolerations:
              - key: nvidia.com/gpu
                operator: Exists
                effect: NoSchedule
              systemNodeSelector:
                {{- range $k, $v := $cpuNodeSelector }}
                {{ $k }}: {{ $v | quote }}
                {{- end }}
              systemNodeTolerations: []
            networkPolicy:
              enabled: true
            podMonitor:
              enabled: false
              interval: 30s
            labeler:
              assumeDriverInstalled: {{ .Values.driverPreinstalled | toString }}
            janitor-provider:
              csp:
                provider: kind
            {{- if $dra }}
            # Janitor is always off here. Set anyway, so enabling it in DRA mode does not
            # fail the render: the janitor chart refuses the default `nvidia` RuntimeClass there.
            janitor:
              config:
                controllers:
                  gpuReset:
                    resetJob:
                      runtimeClassName: ""
            {{- end }}
            {{- if $cordon }}
            fault-quarantine:
              # The chart requests a full CPU; on a 4 CPU services node next to MongoDB that leaves
              # no room for a rolling update. The limit stays at the chart's 1 CPU.
              resources:
                requests:
                  cpu: 250m
              circuitBreaker:
                enabled: true
                percentage: {{ .Values.circuitBreakerPercentage | default "50" | int }}
                maxNodes: {{ .Values.circuitBreakerMaxNodes | default "0" | int }}
            {{- end }}
            {{- if $slinky }}
            node-drainer:
              customDrain:
                enabled: true
                # Never empty: an empty selector sends every node through the Slinky drainer.
                nodeSelector: {{ .Values.slinkyNodeSelector | default "nvidia.com/gpu.present=true" | quote }}
                # Created by the slinky-drainer App.
                templateConfigMapName: slinky-drain-template
                templateMountPath: /etc/drain-template
                templateFileName: drain-template.yaml
                namespace: nvsentinel
                apiGroup: nvsentinel.nvidia.com
                version: v1alpha1
                kind: DrainRequest
                resource: drainrequests
                statusConditionType: DrainComplete
                statusConditionStatus: "True"
                # Whole seconds as a string. node-drainer v1.31.0 fails to start on the chart's
                # own default, "30m".
                timeout: "1800"
            {{- end }}
            mongodb-store:
              mongodb:
                replicaCount: {{ $replicas }}
                # cert-manager issues one server certificate per replica.
                tls:
                  replicaset:
                    existingSecrets:
                      {{- range $i := until $replicas }}
                      - mongo-server-cert-{{ $i }}
                      {{- end }}
                # Also places the MongoDB setup Jobs.
                nodeSelector:
                  {{- range $k, $v := $cpuNodeSelector }}
                  {{ $k }}: {{ $v | quote }}
                  {{- end }}
                persistence:
                  size: 10Gi
            platformConnector:
              affinity:
                nodeAffinity:
                  requiredDuringSchedulingIgnoredDuringExecution:
                    nodeSelectorTerms:
                    - matchExpressions:
                      - key: workload.example.com/pool
                        operator: In
                        values:
                        - gpu-compute
            nodeConditionCleanup:
              nodeSelector:
                {{- range $k, $v := $cpuNodeSelector }}
                {{ $k }}: {{ $v | quote }}
                {{- end }}
              tolerations: []
      syncPolicy:
        managedNamespaceMetadata:
          labels:
            resource.kubernetes.io/admin-access: '{{ if eq (.Values.gpuDriverMode | default "device-plugin") "dra" }}true{{ else }}false{{ end }}'
        automated:
          prune: true
          selfHeal: true
        retry:
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 10m
          limit: 20
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - SkipDryRunOnMissingResource=true
