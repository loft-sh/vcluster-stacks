{{- $d := .Values.dashboard | default dict }}
{{- if $d.enabled }}
{{- /*
  Pin the dashboards to the datasource that holds the gpu_qualification_* series and hide the
  selector: vCluster Platform's Grafana lists one datasource per cluster and tenant cluster, named
  by UUID, which nobody can pick from. The UIDs are generated per installation, in ConfigMaps
  ds-<scope>-<name> beside Grafana. The series are attributed to metrics.fleetObservability.cluster,
  so its control plane datasource (ds-controlplane-<cluster>) is preferred, then the Fleet
  Observability one (ds-fleet-observability-*). dashboard.datasourceUID overrides the lookup;
  without either (helm template has no cluster), the selector stays.
*/ -}}
{{- $uid := $d.datasourceUID | default "" }}
{{- $cluster := ((.Values.metrics | default dict).fleetObservability | default dict).cluster | default "" }}
{{- $configMaps := (lookup "v1" "ConfigMap" ($d.namespace | default .Release.Namespace) "").items | default list }}
{{- range $prefix := list (printf "ds-controlplane-%s" $cluster) "ds-fleet-observability-" }}
{{- range $configMaps }}
{{- if and (not $uid) (ne $prefix "ds-controlplane-") (hasPrefix $prefix .metadata.name) }}
{{- range $_, $file := .data }}
{{- with (fromYaml $file).datasources }}
{{- $uid = (index . 0).uid | default "" }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
# The GPU Burn-In dashboards (Fleet, Failures, Server), generated by recorder/dashboards/gen_gpu_burn_in.py.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-gpu-burn-in
  namespace: {{ $d.namespace | default .Release.Namespace }}
  labels:
    {{- include "recorder.labels" . | nindent 4 }}
    {{- toYaml ($d.labels | default dict) | nindent 4 }}
  annotations:
    gpu-burn-in.vcluster-stacks.io/datasource: {{ $uid | default "selectable" | quote }}
data:
  {{- range $path, $_ := .Files.Glob "dashboards/*.json" }}
  {{- $dash := $.Files.Get $path | fromJson }}
  {{- if $uid }}
  {{- range $dash.templating.list }}
  {{- if eq .name "datasource" }}
  {{- $_ := set . "hide" 2 }}
  {{- $_ := set . "regex" (printf "/^%s$/" $uid) }}
  {{- $_ := set . "current" (dict "text" $uid "value" $uid) }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{ base $path }}: |-
{{ toPrettyJson $dash | indent 4 }}
  {{- end }}
{{- end }}
