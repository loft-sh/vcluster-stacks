<svg viewBox="0 0 984 232" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The Stack's tasks run in order: gpu-operator, gpuready, inventory, dcgmdiag, nccl, soak, report and verdict. gpuready outputs the allocatable GPU count to every GPU test. report publishes the result as Stack outputs, and verdict fails the Stack unless the result is passed.">
