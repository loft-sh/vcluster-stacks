name: GPU Burn-In Recorder Image

# Builds the gpu-burn-in recorder controller (community-stacks/gpu-burn-in/recorder) and publishes
# it to ghcr.io/<repository owner>/gpu-burn-in-recorder, for linux/amd64 and linux/arm64.
#
# Tags:
#   sha-<short sha>   every published build
#   <branch>          the latest build of a branch, for example main
#   <version>, latest a tag named gpu-burn-in-recorder-v<version>, for example
#                     gpu-burn-in-recorder-v0.1.0 publishes 0.1.0
# Pull requests build the image to check it, and publish nothing.
#
# The first push creates the package as private. Make it public under the package's settings, or
# give the chart an imagePullSecret.

on:
  workflow_dispatch:
  push:
    branches: [main, gpu-burn-in]
    tags: ['gpu-burn-in-recorder-v*']
    paths:
      - 'community-stacks/gpu-burn-in/recorder/**'
      - '!community-stacks/gpu-burn-in/recorder/**/*.md'
      - '.github/workflows/gpu-burn-in-recorder-image.yml'
  pull_request:
    branches: [main]
    paths:
      - 'community-stacks/gpu-burn-in/recorder/**'
      - '!community-stacks/gpu-burn-in/recorder/**/*.md'
      - '.github/workflows/gpu-burn-in-recorder-image.yml'

permissions:
  contents: read

# A newer push queues behind a running build rather than cancelling it, so every pushed commit
# that changes the recorder gets its image. Only superseded pull request builds are cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: community-stacks/gpu-burn-in/recorder/go.mod
          cache-dependency-path: community-stacks/gpu-burn-in/recorder/go.sum
      - name: Test
        working-directory: community-stacks/gpu-burn-in/recorder
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          go test ./...
      - name: Image name
        id: name
        # Registry paths must be lowercase; the repository owner may not be.
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/gpu-burn-in-recorder" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=match,pattern=gpu-burn-in-recorder-v(.*),group=1
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/gpu-burn-in-recorder-v') }}
          labels: |
            org.opencontainers.image.title=gpu-burn-in-recorder
            org.opencontainers.image.description=Records gpu-burn-in Stack results on the servers they qualified
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: community-stacks/gpu-burn-in/recorder
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Summary
        if: env.PUBLISH == 'true'
        run: |
          {
            echo "### gpu-burn-in-recorder"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
