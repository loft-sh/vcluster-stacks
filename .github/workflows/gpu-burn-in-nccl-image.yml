name: GPU Burn-In NCCL Image

# Builds the gpu-burn-in nccl-tests image (community-stacks/gpu-burn-in/nccl-image) and publishes it
# to ghcr.io/<repository owner>/gpu-burn-in-nccl, for linux/amd64 and linux/arm64.
#
# Each architecture builds on a native runner: compiling CUDA code under QEMU takes hours. The
# builds push by digest, and a last job joins them into one multi-architecture tag.
#
# Tags:
#   sha-<short sha>   every published build
#   <branch>          the latest build of a branch, for example main
#   <version>, latest a tag named gpu-burn-in-nccl-v<version>
# Pull requests build the image to check it, and publish nothing.
#
# The first push creates the package as private. Make it public under the package's settings.

on:
  workflow_dispatch:
  push:
    branches: [main, gpu-burn-in]
    tags: ['gpu-burn-in-nccl-v*']
    paths:
      - 'community-stacks/gpu-burn-in/nccl-image/**'
      - '!community-stacks/gpu-burn-in/nccl-image/**/*.md'
      - '.github/workflows/gpu-burn-in-nccl-image.yml'
  pull_request:
    branches: [main]
    paths:
      - 'community-stacks/gpu-burn-in/nccl-image/**'
      - '!community-stacks/gpu-burn-in/nccl-image/**/*.md'
      - '.github/workflows/gpu-burn-in-nccl-image.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PUBLISH: ${{ github.event_name != 'pull_request' }}

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Image name
        id: name
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/gpu-burn-in-nccl" >> "$GITHUB_OUTPUT"
          echo "arch=${PLATFORM#linux/}" >> "$GITHUB_OUTPUT"
        env:
          PLATFORM: ${{ matrix.platform }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: community-stacks/gpu-burn-in/nccl-image
          platforms: ${{ matrix.platform }}
          outputs: ${{ env.PUBLISH == 'true' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', steps.name.outputs.image) || 'type=cacheonly' }}
          cache-from: type=gha,scope=nccl-${{ steps.name.outputs.arch }}
          cache-to: type=gha,scope=nccl-${{ steps.name.outputs.arch }},mode=max
      - name: Keep the digest
        if: env.PUBLISH == 'true'
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.PUBLISH == 'true'
        with:
          name: digest-${{ steps.name.outputs.arch }}
          path: /tmp/digests/*
          retention-days: 1

  merge:
    name: Publish the multi-architecture tag
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/gpu-burn-in-nccl" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=match,pattern=gpu-burn-in-nccl-v(.*),group=1
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/gpu-burn-in-nccl-v') }}
      - name: Create the manifest list
        working-directory: /tmp/digests
        run: |
          tags=$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          docker buildx imagetools create $tags $(printf "${IMAGE}@sha256:%s " *)
          {
            echo "### gpu-burn-in-nccl"
            echo
            echo '```'
            jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          IMAGE: ${{ steps.name.outputs.image }}
