name: Validate Manifests

on:
  workflow_dispatch:
    inputs:
      vcluster_version:
        description: vCluster CLI version (empty for pinned default, or latest/SemVer)
        required: false
        default: ""
        type: string
      platform_version:
        description: vCluster Platform version (empty for pinned default, or latest/SemVer)
        required: false
        default: ""
        type: string
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contribution-standard:
    name: Contribution standard
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    outputs:
      platform: ${{ steps.changes.outputs.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select Platform validation
        id: changes
        run: python3 hack/ci_changes.py
      - name: Create validation environment
        run: python3 -m venv .venv
      - name: Install validation dependencies
        run: .venv/bin/python -m pip install -r hack/requirements.txt
      - name: Test validation and review tooling
        run: .venv/bin/python -m unittest discover -s hack/tests -v
      - name: Validate contribution structure and resources
        run: .venv/bin/python hack/validate_stacks.py
  validate:
    name: Render and validate
    needs: contribution-standard
    if: needs.contribution-standard.outputs.platform == 'true'
    # Fork scripts run only on a fresh GitHub-hosted VM, never a persistent runner.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # renovate: datasource=github-releases depName=loft-sh/vcluster
      VCLUSTER_VERSION: ${{ github.event.inputs.vcluster_version || 'v0.37.7' }}
      # renovate: datasource=github-releases depName=loft-sh/loft extractVersion=^v(?<version>.+)$
      PLATFORM_VERSION: ${{ github.event.inputs.platform_version || '4.12.6' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate requested versions
        run: |
          for version in "$VCLUSTER_VERSION" "$PLATFORM_VERSION"; do
            if [[ ! "$version" =~ ^latest$|^v?[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z]+)*$ ]]; then
              echo "Invalid version: $version. Use latest or SemVer." >&2
              exit 1
            fi
          done
      - name: Set up vind
        uses: loft-sh/setup-vind@1ffff82986c3afff90ba8f357f69541b24e3a8f0 # v1
        with:
          version: ${{ env.VCLUSTER_VERSION }}
      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5
      - name: Set up manifest validation prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep python3-yaml
      - name: Run discovered integration checks
        run: python3 hack/validate_stacks.py --run-checks
      - name: Start vCluster Platform
        env:
          # Fail inside the job's timeout so the diagnostics step below can run. Default is 10m.
          LOFT_TIMEOUT: 4m
        run: |
          cat > "$RUNNER_TEMP/platform-values.yaml" <<'EOF'
          env:
            DISABLE_LOFT_ROUTER: true
          EOF
          vcluster platform start \
            --version "$PLATFORM_VERSION" \
            --password test123 \
            --host vcluster-platform.local \
            --no-login \
            --no-port-forwarding \
            --no-tunnel \
            --config "$RUNNER_TEMP/platform-vcluster-config.json" \
            --values "$RUNNER_TEMP/platform-values.yaml"
          kubectl wait --for=condition=Available apiservice/v1.management.loft.sh --timeout=5m
      - name: Platform startup diagnostics
        if: failure()
        run: |
          set +e
          echo "::group::Nodes"
          kubectl get nodes -o wide
          kubectl describe nodes | sed -n '/^Conditions:/,/^Addresses:/p'
          echo "::endgroup::"
          echo "::group::Pods"
          kubectl get pods -A -o wide
          echo "::endgroup::"
          echo "::group::Platform pod"
          kubectl describe pod -A -l app=loft
          echo "::endgroup::"
          echo "::group::Events"
          kubectl get events -A --sort-by=.lastTimestamp | tail -60
          echo "::endgroup::"
          while IFS=/ read -r namespace pod; do
            [ -n "$pod" ] || continue
            echo "::group::Logs $namespace/$pod (current)"
            kubectl logs -n "$namespace" "$pod" --all-containers --tail=200 || true
            echo "::endgroup::"
            echo "::group::Logs $namespace/$pod (previous)"
            kubectl logs -n "$namespace" "$pod" --all-containers --previous --tail=200 || true
            echo "::endgroup::"
          done < <(kubectl get pods -A -l app=loft -o jsonpath='{range .items[*]}{.metadata.namespace}/{.metadata.name}{"\n"}{end}')
      - name: Validate discovered Platform documents
        run: python3 hack/validate_stacks.py --server
